<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор маржи · Спутник</title>
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор маржи">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6F5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  :root {
    --bg: #F5F6F3;
    --surface: #FFFFFF;
    --border: #DDE2DC;
    --text: #1C2620;
    --text-muted: #6B786F;
    --text-faint: #8C9A93;
    --accent: #2F6F5B;
    --accent-contrast: #FFFFFF;
    --success-bg: #E7F2EA;
    --success-text: #265C3D;
    --danger-text: #8A3229;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141815;
      --surface: #1E2420;
      --border: #333B35;
      --text: #ECF1ED;
      --text-muted: #A9B4AC;
      --text-faint: #7C8880;
      --accent: #46997F;
      --accent-contrast: #08130F;
      --success-bg: #17301F;
      --success-text: #7FD9A0;
      --danger-text: #E58F82;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141815;
    --surface: #1E2420;
    --border: #333B35;
    --text: #ECF1ED;
    --text-muted: #A9B4AC;
    --text-faint: #7C8880;
    --accent: #46997F;
    --accent-contrast: #08130F;
    --success-bg: #17301F;
    --success-text: #7FD9A0;
    --danger-text: #E58F82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 20px 16px 40px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 4px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 12px; }
  label { display: block; margin-bottom: 12px; }
  label:last-child { margin-bottom: 0; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
  input, select {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; font-size: 16px; color: var(--text); background: var(--surface);
    font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result-box { background: var(--success-bg); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .result-label { font-size: 12px; font-weight: 500; color: var(--success-text); opacity: 0.85; margin-bottom: 4px; }
  .result-value { font-size: 30px; font-weight: 700; color: var(--success-text); font-variant-numeric: tabular-nums; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
  .breakdown-row:last-child { border-bottom: none; font-weight: 600; }
  .breakdown-row span:first-child { color: var(--text-muted); }
  .breakdown-row span:last-child { font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; color: var(--text-faint); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .offline-note { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 18px; }
</style>

</head>
<body>
<div class="wrap">
  <div class="brand">🚚 СПУТНИК · ЭКСПЕДИРОВАНИЕ</div>
  <h1>Калькулятор маржинальности</h1>

  <div class="card">
    <div class="card-title">ЗАКАЗЧИК</div>
    <label>
      <div class="field-label">Сумма</div>
      <input id="customerAmount" type="number" inputmode="decimal" placeholder="0">
    </label>
    <label>
      <div class="field-label">Система налогообложения</div>
      <select id="customerTax">
        <option value="22">НДС 22%</option>
        <option value="5">НДС 5%</option>
        <option value="0">Без НДС</option>
      </select>
    </label>
  </div>

  <div class="card">
    <div class="card-title">ПЕРЕВОЗЧИК</div>
    <label>
      <div class="field-label">Сумма</div>
      <input id="carrierAmount" type="number" inputmode="decimal" placeholder="0">
    </label>
    <label>
      <div class="field-label">Система налогообложения</div>
      <select id="carrierTax">
        <option value="22">НДС 22%</option>
        <option value="5">НДС 5%</option>
        <option value="0">Без НДС</option>
      </select>
    </label>
  </div>

  <div class="result-box">
    <div class="result-label">Реальная прибыль</div>
    <div class="result-value" id="realProfit">0 ₽</div>
  </div>

  <div class="card">
    <div class="breakdown-row"><span>Грязная маржа</span><span id="grossMargin">0 ₽</span></div>
    <div class="breakdown-row"><span>НДС к уплате</span><span id="vatPayable">0 ₽</span></div>
    <div class="breakdown-row" id="profitTaxRow"><span>Налог на прибыль</span><span id="profitTax">0 ₽</span></div>
    <div class="breakdown-row"><span>Реальная прибыль</span><span id="realProfit2">0 ₽</span></div>
    <div class="note" id="regimeNote"></div>
  </div>

  <div class="offline-note">Считает локально в браузере — работает без интернета</div>
</div>

<script>
  var ids = ["customerAmount","customerTax","carrierAmount","carrierTax"];

  function netAmount(amount, tax) {
    var v = parseFloat(amount) || 0;
    if (tax === "22") return v / 1.22;
    if (tax === "5") return v / 1.05;
    return v;
  }
  function vatPortion(amount, tax) {
    return (parseFloat(amount) || 0) - netAmount(amount, tax);
  }
  function profitTaxRate(customerTax) {
    return customerTax === "22" ? 0.25 : 0.15;
  }
  function money(n) {
    if (isNaN(n)) return "—";
    return Math.round(n).toLocaleString("ru-RU") + " ₽";
  }

  function recalc() {
    var customerAmount = document.getElementById("customerAmount").value;
    var customerTax = document.getElementById("customerTax").value;
    var carrierAmount = document.getElementById("carrierAmount").value;
    var carrierTax = document.getElementById("carrierTax").value;

    var grossMargin = (parseFloat(customerAmount) || 0) - (parseFloat(carrierAmount) || 0);
    var netCustomer = netAmount(customerAmount, customerTax);
    var netCarrier = netAmount(carrierAmount, carrierTax);
    var netMargin = netCustomer - netCarrier;
    var rate = profitTaxRate(customerTax);
    var profitTax = netMargin * rate;
    var realProfit = netMargin - profitTax;
    var vatPayable = vatPortion(customerAmount, customerTax) - vatPortion(carrierAmount, carrierTax);

    document.getElementById("realProfit").textContent = money(realProfit);
    document.getElementById("realProfit2").textContent = money(realProfit);
    document.getElementById("grossMargin").textContent = money(grossMargin);
    document.getElementById("vatPayable").textContent = money(vatPayable);
    document.getElementById("profitTax").textContent = money(profitTax);
    document.querySelector("#profitTaxRow span:first-child").textContent = "Налог на прибыль (" + Math.round(rate * 100) + "%)";
    document.getElementById("regimeNote").textContent = customerTax === "22"
      ? "Спутник на ОСНО в этой сделке (заказчик с НДС 22%)"
      : "Спутник на УСН в этой сделке (заказчик без НДС или с НДС 5%)";

    try {
      localStorage.setItem("calc-last", JSON.stringify({ customerAmount: customerAmount, customerTax: customerTax, carrierAmount: carrierAmount, carrierTax: carrierTax }));
    } catch (e) {}
  }

  ids.forEach(function(id) {
    document.getElementById(id).addEventListener("input", recalc);
  });

  try {
    var saved = localStorage.getItem("calc-last");
    if (saved) {
      var d = JSON.parse(saved);
      document.getElementById("customerAmount").value = d.customerAmount || "";
      document.getElementById("customerTax").value = d.customerTax || "22";
      document.getElementById("carrierAmount").value = d.carrierAmount || "";
      document.getElementById("carrierTax").value = d.carrierTax || "22";
    }
  } catch (e) {}

  recalc();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
